name: Repository validation

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  host-validation:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: |
          python -m py_compile make/Telink_Tools.py tools/validate_repository.py tests/test_telink_tools.py
      - name: Validate repository
        run: python tools/validate_repository.py
      - name: Run host-side tests
        run: python -m unittest discover -s tests -v

  firmware-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y make bzip2 wget
      - name: Install checksum-pinned TC32 toolchain
        run: |
          wget -q https://shyboy.oss-cn-shenzhen.aliyuncs.com/readonly/tc32_gcc_v2.0.tar.bz2
          echo "33b854be3e3db3dba4b4dacdda2cd4ea1c94dfd4d562864a095956de7991b430  tc32_gcc_v2.0.tar.bz2" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tc32"
          tar -xjf tc32_gcc_v2.0.tar.bz2 -C "$RUNNER_TEMP/tc32" --strip-components=1
      - name: Build all firmware projects
        env:
          TC32_TOOLCHAIN_BIN: ${{ runner.temp }}/tc32/bin
        run: bash tools/build_all.sh
